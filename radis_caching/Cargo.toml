[package]
name = "radis_caching"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"] }
dotenvy = "0.15"
axum = "0.8.9"
serde = {version="1.0.229" , features=["derive"]}
serde_json = "1.0.151"
tokio = {version="1.53.1",features=["full"]}
